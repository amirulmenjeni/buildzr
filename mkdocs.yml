site_name: buildzr
site_description: Structurizr for the buildzrs - A Python authoring tool for Structurizr models and diagrams
site_author: Amirul Menjeni
site_url: https://buildzr.dev

repo_name: amirulmenjeni/buildzr
repo_url: https://github.com/amirulmenjeni/buildzr
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  language: custom
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - smarty

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  # Versioned docs (https://buildzr.dev/<version>/), deployed by scripts/docs_pages.sh. The canonical address of
  # every page is its copy under /latest/, so search engines index the latest release.
  - mike:
      canonical_version: latest
      version_selector: false
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Use buildzr with AI agents: getting-started/ai-agents.md
    - Try it in your browser: demo.md
  - User Guide:
    - Core Concepts: user-guide/core-concepts.md
    - Workspace: user-guide/workspace.md
    - Models: user-guide/models.md
    - Relationships: user-guide/relationships.md
    - Views: user-guide/views.md
    - Deployment Views: user-guide/deployment.md
    - Styles: user-guide/styles.md
    - Themes: user-guide/themes.md
    - Export: user-guide/export.md
  - Publishing:
    - Serve your workspaces: serve-workspaces.md
    - Command reference: cli.md
    - buildzr.yaml: config.md
    - Recipes: publishing-recipes.md
    - Hosting the built workspaces elsewhere: hosting.md
    - Viewer settings: ui-settings.md
    - Viewer links: viewer-hash-routes.md
  - API Reference:
    - DSL: api/dsl.md
    - Models: api/models.md
    - Model API: model-api.md
  - Development:
    - Contributing: contributing.md
    - Roadmap: roadmap.md
    - Structurizr compatibility: structurizr-compatibility.md

extra:
  # Material's version selector, filled from /versions.json; a version other than "latest" shows the outdated banner.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amirulmenjeni/buildzr

extra_javascript:
  - javascripts/runcode-client.js
  - javascripts/interactive-code.js
  - javascripts/demo.js

extra_css:
  - stylesheets/runcode.css
  - stylesheets/demo.css
  - stylesheets/roadmap.css
