name: release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.10

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Get tags to check whether the version is released

    - name: Install Hatch
      run: uv tool install hatch==1.18.0

    # Releases are cut by setting a final version (e.g. `0.0.32`) in
    # `buildzr/__about__.py` through a pull request. This workflow never pushes
    # commits to master, so master can be protected against direct pushes.
    - name: Check for unreleased version
      id: check-version
      run: |
        VERSION="$(hatch version)"
        TAG="v$VERSION"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "$VERSION is not a final release version. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
        elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          echo "$TAG is already released. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.check-version.outputs.release == 'true'
      run: |
        uv build

    - name: Upload build
      if: steps.check-version.outputs.release == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: dist/

    - name: Publish package to PyPI
      if: steps.check-version.outputs.release == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    # Tag after publishing so a failed publish can be retried by re-running
    # the workflow.
    - name: Push tag
      if: steps.check-version.outputs.release == 'true'
      env:
        TAG: ${{ steps.check-version.outputs.tag }}
      run: |
        git tag "$TAG"
        git push origin "refs/tags/$TAG"
