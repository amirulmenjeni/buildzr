[project]
name = "buildzr"
dynamic = ["version"]
description = "Structurizr for the `buildzr`s 🧱⚒️"
readme = "README.md"
# PEP 639: both ship in the wheel under `.dist-info/licenses/` and in the sdist root.
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Amirul Menjeni", email = "amirulmenjeni@pm.me" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
keywords = [
    "buildzr",
    "structurizr",
    "c4model",
    "diagram",
    "architecture",
    "design",
]
dependencies = [
    "pytest>=8.3.3",
    "pyhumps==3.8.0",
    "typing-extensions>=4.12.2",
    "pyyaml>=6.0.3",
    "jsonschema>=4.23.0",
]

[project.scripts]
buildzr = "buildzr.site.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "mypy_extensions==1.1.0",
    "pytest-mypy==1.1.0",
    "jsondiff==2.2.1",
    "yq==4.4.5",
    "datamodel-code-generator==0.86.0",
    "ipykernel==7.3.0",
    "types-PyYAML>=6.0.12",
    "types-Markdown>=3.7",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
    "mike>=2.1",
]
export-plantuml = [
    "jpype1>=1.4.0",
]

[project.urls]
homepage = "https://github.com/amirulmenjeni/buildzr"
issues = "https://github.com/amirulmenjeni/buildzr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "buildzr/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "CONTRIBUTING.md",
    "tests",
    "buildzr",
    # The agent skill: the tests in the sdist read it. The wheel ships only `buildzr`.
    "/skills",
]
exclude = [
    "examples",
    "buildzr/modes/generate.sh",
]
# The viewer bundle is gitignored build output; hatch skips ignored files unless listed here.
# Needed in the sdist too, because `uv build` builds the wheel from the sdist.
artifacts = ["buildzr/site/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["buildzr"]
# The viewer bundle is gitignored build output; hatch skips ignored files unless listed here.
artifacts = ["buildzr/site/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
markers = [
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = false
ignore_missing_imports = false
show_error_codes = true
warn_unused_ignores = true
