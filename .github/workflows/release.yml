name: release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

# Queue releases instead of running them in parallel, so two quick merges to
# master cannot publish at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only release from master, also when the workflow is run manually.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release tag
      id-token: write # PyPI Trusted Publishing (OIDC), no stored token
    outputs:
      release: ${{ steps.check-version.outputs.release }}
      docs: ${{ steps.check-version.outputs.docs }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.10

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # Get tags to check whether the version is released

    - name: Install Hatch
      run: uv tool install hatch==1.18.0

    # Releases are cut by setting a final version (e.g. `0.0.32`) or a release
    # candidate (e.g. `0.1.0rc1`) in `buildzr/__about__.py` through a pull request. This workflow never pushes
    # commits to master, so master can be protected against direct pushes.
    - name: Check for unreleased version
      id: check-version
      run: |
        VERSION="$(hatch version)"
        TAG="v$VERSION"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        # Final versions (X.Y.Z) and release candidates (X.Y.ZrcN) only: no
        # leading zeros, no dev, alpha, beta or post suffix.
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*(rc(0|[1-9][0-9]*))?$ ]]; then
          echo "::notice::'$VERSION' is not a final or release candidate version. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The docs of buildzr.dev show final releases (X.Y.Z) only, never a release candidate.
        if [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "docs=true" >> "$GITHUB_OUTPUT"
        else
          echo "docs=false" >> "$GITHUB_OUTPUT"
        fi

        # Check the remote too, in case the tag was pushed after checkout.
        status=0
        git rev-parse -q --verify "refs/tags/$TAG" >/dev/null ||
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null ||
          status=$?
        if [[ $status -eq 0 ]]; then
          echo "::notice::$TAG is already released. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
        elif [[ $status -eq 2 ]]; then
          echo "release=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Could not check whether $TAG exists on origin."
          exit "$status"
        fi

    # The viewer is gitignored build output that ships inside the package
    # (buildzr/site/static/), so it must be built before `uv build`.
    - name: Set up Node
      if: steps.check-version.outputs.release == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Build viewer
      if: steps.check-version.outputs.release == 'true'
      working-directory: viewer
      run: |
        npm ci
        npm run build

    - name: Build package
      if: steps.check-version.outputs.release == 'true'
      run: |
        uv build

    # Fail before publishing if the viewer, the schemas or the version are
    # missing from the sdist or the wheel.
    - name: Check package
      if: steps.check-version.outputs.release == 'true'
      run: |
        python3 .github/scripts/check_wheel.py dist --sdist

    - name: Upload build
      if: steps.check-version.outputs.release == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build
        path: dist/
        overwrite: true # A re-run must not fail on the previous attempt's artifact

    - name: Publish package to PyPI
      if: steps.check-version.outputs.release == 'true'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        skip-existing: true

    # Tag after publishing so a failed publish can be retried by re-running
    # the workflow.
    - name: Push tag
      if: steps.check-version.outputs.release == 'true'
      env:
        TAG: ${{ steps.check-version.outputs.tag }}
      run: |
        git tag "$TAG"
        git push origin "refs/tags/$TAG"

  # Publish the docs of the release to buildzr.dev (/<version>/ and /latest/), after the package is on PyPI and the
  # tag is pushed. Only when this run released a final version: release candidates (X.Y.ZrcN) are not published to
  # the docs, and a run that released nothing publishes nothing.
  docs:
    needs: publish
    if: needs.publish.outputs.release == 'true' && needs.publish.outputs.docs == 'true'
    permissions:
      contents: write # Push to the gh-pages branch
    uses: ./.github/workflows/docs-publish.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
