name: Build Documentation

# Builds the docs with --strict on pull requests and on pushes to master, as a check. It publishes nothing:
# buildzr.dev shows released docs only. docs-publish.yml publishes the docs of a release (release.yml calls it), and
# docs-roadmap.yml publishes the roadmap of master at /roadmap/.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.11
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --extra docs --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the Run Code assets
        run: |
          (cd viewer && npm ci)
          uv run python scripts/build_docs_assets.py

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build the roadmap site
        run: uv run mkdocs build --strict --config-file mkdocs-roadmap.yml

      - name: Check the publishing scripts
        run: |
          bash -n scripts/docs_pages.sh
          bash -n scripts/backfill_docs.sh
