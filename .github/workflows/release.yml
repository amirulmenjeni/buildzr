name: release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

# Queue releases instead of running them in parallel, so two quick merges to
# master cannot publish at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only release from master, also when the workflow is run manually.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.10

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Get tags to check whether the version is released

    - name: Install Hatch
      run: uv tool install hatch==1.18.0

    # Releases are cut by setting a final version (e.g. `0.0.32`) or a release
    # candidate (e.g. `0.1.0rc1`) in `buildzr/__about__.py` through a pull request. This workflow never pushes
    # commits to master, so master can be protected against direct pushes.
    - name: Check for unreleased version
      id: check-version
      run: |
        VERSION="$(hatch version)"
        TAG="v$VERSION"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        # Final versions (X.Y.Z) and release candidates (X.Y.ZrcN) only: no
        # leading zeros, no dev, alpha, beta or post suffix.
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*(rc(0|[1-9][0-9]*))?$ ]]; then
          echo "::notice::'$VERSION' is not a final or release candidate version. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Check the remote too, in case the tag was pushed after checkout.
        status=0
        git rev-parse -q --verify "refs/tags/$TAG" >/dev/null ||
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null ||
          status=$?
        if [[ $status -eq 0 ]]; then
          echo "::notice::$TAG is already released. Skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
        elif [[ $status -eq 2 ]]; then
          echo "release=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Could not check whether $TAG exists on origin."
          exit "$status"
        fi

    # The viewer is gitignored build output that ships inside the package
    # (buildzr/site/static/), so it must be built before `uv build`.
    - name: Set up Node
      if: steps.check-version.outputs.release == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build viewer
      if: steps.check-version.outputs.release == 'true'
      working-directory: viewer
      run: |
        npm ci
        npm run build

    - name: Build package
      if: steps.check-version.outputs.release == 'true'
      run: |
        uv build

    # Fail before publishing if the viewer, the schemas or the version are
    # missing from the sdist or the wheel.
    - name: Check package
      if: steps.check-version.outputs.release == 'true'
      run: |
        python3 .github/scripts/check_wheel.py dist --sdist

    - name: Upload build
      if: steps.check-version.outputs.release == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: dist/
        overwrite: true # A re-run must not fail on the previous attempt's artifact

    - name: Publish package to PyPI
      if: steps.check-version.outputs.release == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    # Tag after publishing so a failed publish can be retried by re-running
    # the workflow.
    - name: Push tag
      if: steps.check-version.outputs.release == 'true'
      env:
        TAG: ${{ steps.check-version.outputs.tag }}
      run: |
        git tag "$TAG"
        git push origin "refs/tags/$TAG"
