name: build

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.check-src-changed.outputs.src }}
      docs: ${{ steps.check-src-changed.outputs.docs }}
      package: ${{ steps.check-src-changed.outputs.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@v4
        id: check-src-changed
        with:
          filters: |
            src:
              - 'buildzr/**'
              - 'tests/**'
              - 'viewer/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.devcontainer/**'
              - '.github/workflows/**'
            package:
              - 'buildzr/**'
              - 'viewer/**'
              - 'pyproject.toml'
              - 'hatch_build.py'
              - '.github/**'
            docs:
              - 'README.md'
              - 'docs/**'
              - 'roadmap.yml'
              - 'scripts/mkdocs_hooks.py'

  check_skip_flags:
    runs-on: ubuntu-latest
    outputs:
      head-commit-message: ${{ steps.get-head-commit-message.outputs.commit_message }}
    steps:
      - name: Get repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Get HEAD commit message
        id: get-head-commit-message
        run: |
          delimiter="$(uuidgen)"
          commit_message="$(git log --format=%B -n 1)"
          while grep -Fqx "$delimiter" <<< "$commit_message"; do
            delimiter="$(uuidgen)"
          done
          {
            printf 'commit_message<<%s\n' "$delimiter"
            printf '%s\n' "$commit_message"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # Catch version bump mistakes before merging, as the release workflow only
  # notices them after merging (it skips or fails). Compares the version on the
  # base branch with the version that merging would produce (the default
  # checkout of a pull_request event is the merge commit, whose first parent is
  # the base branch), so pull requests that do not change VERSION pass silently.
  check_version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Get the base commit and tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.11

      - name: Test package check
        run: python3 .github/scripts/test_check_wheel.py

      - name: Test version bump check
        run: uv run --no-project --with packaging==26.3 python .github/scripts/test_check_version_bump.py

      - name: Check version bump
        shell: bash # Adds -o pipefail
        run: |
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::Expected the pull request merge commit to be checked out."
            exit 1
          fi
          check() {
            uv run --no-project --with packaging==26.3 python .github/scripts/check_version_bump.py "$@"
          }
          base_version="$(git show HEAD^1:buildzr/__about__.py | check read-version)"
          head_version="$(git show HEAD:buildzr/__about__.py | check read-version)"
          git tag --list 'v*' | check "$base_version" "$head_version"

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Get every commit of the pull request

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # As in the image of the action this replaces

      - name: Test commit lint script
        run: python3 .github/scripts/test_lint_commits.py

      # Not wagoid/commitlint-github-action, which cannot exempt commits and
      # lints only the first 100 commits of a pull request.
      # commitlint 19.8.1 is the last 19.x release, the major the action's
      # 6.2.1 image used (^19), and supports Node >=18.
      - name: Lint commit messages
        env:
          COMMITLINT: npx --no-install commitlint
          BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm install --no-save --no-package-lock \
            @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          python3 .github/scripts/lint_commits.py "$BASE" "$HEAD"

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    needs:
      - check_skip_flags
      - commitlint
      - check_changes

    if: |
      ${{
        !contains(needs.check_skip_flags.outputs.head-commit-message, '[skip-ci]') &&
        needs.check_changes.outputs.src == 'true'
      }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Structurizr CLI
      run: |
        wget -q https://github.com/structurizr/cli/releases/download/v2024.03.03/structurizr-cli.zip
        sudo unzip -q structurizr-cli.zip -d /opt/structurizr-cli
        sudo ln -s /opt/structurizr-cli/structurizr.sh /usr/bin/structurizr.sh
        rm structurizr-cli.zip

    - name: Install Graphviz
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq graphviz
        dot -V

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Sync dependencies
      run: uv sync --all-extras --locked --python ${{ matrix.python-version }}

    - name: Validate optional dependencies
      run: uv run --python ${{ matrix.python-version }} python -c "import IPython, datamodel_code_generator, jpype, mkdocs, mypy, yq"

    # The viewer is gitignored build output (buildzr/site/static/). The tests of
    # `buildzr build` and the documentation examples need it, and the real
    # layout needs Node.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build viewer
      working-directory: viewer
      run: |
        npm ci
        npm run build

    - name: Run tests
      run: uv run --python ${{ matrix.python-version }} pytest --mypy tests

  build:
    runs-on: ubuntu-latest
    needs:
      - check_changes

    if: |
      ${{ needs.check_changes.outputs.src == 'true' || needs.check_changes.outputs.docs == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Get full history and tags
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.10

    - name: Install Hatch
      run: uv tool install hatch==1.18.0

    # Note: See https://github.com/PaulHatch/semantic-version?tab=readme-ov-file#outputs
    # for the full list of outputs.
    - name: Get semantic version
      uses: paulhatch/semantic-version@v6.0.5
      id: semantic-version
      with:
        tag_prefix: "v"

        # e.g., `feat(scope)!:` or `feat!:`
        major_pattern: "/^\\w+(\\(.+\\))?!:/"
        major_regexp_flags: ""

        # e.g., `feat(scope):` or `feat:`
        minor_pattern: "/^feat(\\(.+\\))?:/"
        minor_regexp_flags: ""

        # Follow default hatch versioning format.
        # See: https://hatch.pypa.io/1.9/version/#supported-segments
        version_format: "v${major}.${minor}.${patch}.dev${increment}"
        bump_each_commit: false
        bump_each_commit_patch_pattern: ""
        search_commit_body: false
        user_format_type: "csv"
        enable_prerelease_mode: false
        debug: false
        version_from_branch: false

    - name: Display semantic version debug output
      if: ${{ steps.semantic-version.outputs.debug_output != null }}
      run: |
        jq <<< '${{ steps.semantic-version.outputs.debug_output }}'

    # A release PR sets a final version (e.g. 0.0.33) in buildzr/__about__.py,
    # which is higher than the computed dev version (e.g. v0.0.33.dev3), and
    # hatch refuses to bump to a version that is not higher than the current one.
    # Compare with PEP 440 semantics using the packaging library from hatch's
    # own tool environment, and build with the file version when it is ahead.
    - name: Update Version
      env:
        version: ${{ steps.semantic-version.outputs.version }}
      run: |
        current_version="$(hatch version)"
        hatch_python="$(uv tool dir)/hatch/bin/python"
        is_higher="$("$hatch_python" -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]) > Version(sys.argv[2]))' "$version" "$current_version")"
        if [ "$is_higher" = "True" ]; then
          hatch version "$version"
        else
          echo "::notice::File version $current_version is already ahead of (or equal to) computed version $version; skipping version update."
        fi

    # The viewer is gitignored build output that ships inside the package.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build viewer
      working-directory: viewer
      run: |
        npm ci
        npm run build

    - name: Viewer unit tests
      working-directory: viewer
      run: npm run test:unit

    - name: Build package
      run: |
        uv build

    - name: Check package
      run: python3 .github/scripts/check_wheel.py dist --sdist

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: dist/

    - name: Display uploaded artifacts
      run: |
        ls -R

  # Proves that the package a user would install works: builds the viewer and
  # the package like the release workflow, checks them, then installs the wheel
  # into a fresh venv and runs build and serve for real. All the logic
  # is in smoke_wheel.sh, which can also be run locally.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs:
      - check_changes
    if: ${{ needs.check_changes.outputs.package == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.10

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build viewer
      working-directory: viewer
      run: |
        npm ci
        npm run build

    - name: Build package
      run: uv build

    - name: Smoke test the built wheel
      run: .github/scripts/smoke_wheel.sh dist

  package_validation:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.12.11
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist

    - name: Check wheel and sdist metadata
      run: uv run --python ${{ matrix.python-version }} --with twine==7.0.0 twine check dist/*

    - name: Install and import wheel
      run: |
        uv venv --python ${{ matrix.python-version }} .wheel-venv
        uv pip install --python .wheel-venv/bin/python dist/*.whl
        cd dist
        ../.wheel-venv/bin/python -c "import buildzr"

    - name: Install and import sdist
      run: |
        uv venv --python ${{ matrix.python-version }} .sdist-venv
        uv pip install --python .sdist-venv/bin/python dist/*.tar.gz
        cd dist
        ../.sdist-venv/bin/python -c "import buildzr"
